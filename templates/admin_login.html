<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الإدارة المركزية - دورك</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'IBM Plex Sans Arabic', sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-[#FAFAFA] text-zinc-950 min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-sm bg-white border border-zinc-200 rounded-xl p-6 sm:p-8 space-y-6 shadow-sm">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-xl bg-zinc-900 text-white flex items-center justify-center mx-auto shadow-sm">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="text-lg font-bold text-zinc-950">لوحة الإدارة المركزية</h1>
      <p class="text-xs text-zinc-500">منظومة إدارة الصالونات والاشتراكات والميزات</p>
    </div>

    <!-- Error message alert -->
    <div id="login-error-alert" class="hidden p-3 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium text-center">
      رمز المرور السري غير صحيح.
    </div>

    <form onsubmit="handleAdminLogin(event)" class="space-y-4">
      <div class="space-y-1.5">
        <label for="admin-pin-input" class="block text-xs font-semibold text-zinc-800">
          الرمز السري الرئيسي (Master PIN):
        </label>
        <div class="relative">
          <input 
            type="password" 
            id="admin-pin-input" 
            required 
            maxlength="20" 
            placeholder="••••••••" 
            autocomplete="current-password"
            class="w-full bg-zinc-50 border border-zinc-200 focus:bg-white focus:border-zinc-900 rounded-lg px-4 py-2.5 text-center text-lg font-mono text-zinc-900 tracking-widest outline-none transition"
          >
          <button 
            type="button" 
            onclick="togglePinVisibility()" 
            class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-700 p-1 transition"
            title="إظهار / إخفاء"
          >
            <svg id="eye-icon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button 
        type="submit" 
        id="login-submit-btn" 
        class="w-full py-2.5 bg-zinc-900 hover:bg-zinc-800 text-white font-semibold text-xs rounded-lg transition active:scale-98 flex items-center justify-center gap-2"
      >
        <span>تسجيل الدخول</span>
      </button>
    </form>

    <div class="text-center pt-3 border-t border-zinc-100 text-[11px] text-zinc-400">
      منصة دورك (Dorek) • بيئة الإدارة الآمنة
    </div>
  </div>

  <script>
    function togglePinVisibility() {
      const input = document.getElementById('admin-pin-input');
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const pin = document.getElementById('admin-pin-input').value.trim();
      const errBox = document.getElementById('login-error-alert');
      const btn = document.getElementById('login-submit-btn');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = 'جاري التحقق...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = '/admin';
        } else {
          errBox.textContent = data.error || 'رمز المرور غير صحيح';
          errBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = 'تسجيل الدخول';
        }
      } catch (err) {
        errBox.textContent = 'تعذر الاتصال بالسيرفر، يرجى إعادة المحاولة';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = 'تسجيل الدخول';
      }
    }
  </script>
</body>
</html>
