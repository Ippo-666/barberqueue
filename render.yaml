services:
  - type: web
    name: barberqueue-dz
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class=gthread --workers=2 --threads=4 --timeout=120 --bind=0.0.0.0:$PORT server:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: barberqueue-db
          property: connectionString
      - key: FLASK_ENV
        value: production

databases:
  - name: barberqueue-db
    databaseName: barberqueue
    user: barber_admin
    plan: free
