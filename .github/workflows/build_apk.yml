name: Build BarberQueue APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create BarberQueue Mobile App
        run: |
          set -e
          echo "=== 1. Creating Flutter App ==="
          flutter create barber_app --org com.barberqueue.dz --platforms android
          cd barber_app

          echo "=== 2. Upgrading Kotlin Version for Android Compatibility ==="
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' android/build.gradle || true
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/compileSdkVersion = flutter\.compileSdkVersion/compileSdkVersion = 34/' android/app/build.gradle || true
            sed -i -E 's/compileSdkVersion [0-9]+/compileSdkVersion 34/' android/app/build.gradle || true
            sed -i -E 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 34/' android/app/build.gradle || true
            sed -i -E 's/compileSdk [0-9]+/compileSdk 34/' android/app/build.gradle || true
            sed -i -E 's/targetSdkVersion [0-9]+/targetSdkVersion 34/' android/app/build.gradle || true
            sed -i -E 's/targetSdk [0-9]+/targetSdk 34/' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion = flutter\.minSdkVersion/minSdkVersion = 21/' android/app/build.gradle || true
            sed -i -E 's/minSdkVersion [0-9]+/minSdkVersion 21/' android/app/build.gradle || true
            sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = 21/' android/app/build.gradle || true
            sed -i -E 's/minSdk [0-9]+/minSdk 21/' android/app/build.gradle || true
          fi

          echo "=== 3. Adding Dependencies ==="
          flutter pub add "webview_flutter:^4.7.0" "webview_flutter_android:^3.16.1" "url_launcher:^6.3.0" "permission_handler:^11.3.1" "connectivity_plus:^6.0.5"
          flutter pub add flutter_localizations --sdk=flutter

          echo "=== 4. Configuring Android Permissions & Intent Queries ==="
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' "$MANIFEST"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          sed -i 's/android:label="[^"]*"/android:label="دورك (Dorek)"/g' "$MANIFEST"
          
          # Add Package Visibility Queries for Android 11+ (WhatsApp, Maps, Tel)
          QUERIES='<queries>\n    <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="whatsapp" /></intent>\n    <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="tel" /></intent>\n    <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="geo" /></intent>\n    <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n</queries>'
          sed -i "/<manifest/a \$QUERIES" "$MANIFEST"

          echo "=== 5. Copying Project lib/main.dart (Full Production App) ==="
          if [ -f "../lib/main.dart" ]; then
            cp ../lib/main.dart lib/main.dart
            echo "Full lib/main.dart copied successfully!"
          fi

          echo "=== 6. Building Release APK ==="
          flutter build apk --release

          echo "=== 7. Copying APK ==="
          cp build/app/outputs/flutter-apk/app-release.apk ../BarberQueue.apk
          echo "APK build complete: BarberQueue.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarberQueue-APK
          path: BarberQueue.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.7-${{ github.run_number }}" BarberQueue.apk \
            --title "BarberQueue Android App v1.0.7 (Dorek)" \
            --notes "تطبيق دورك (BarberQueue DZ) الإصدار v1.0.7:
          1. معالجة الشاشة السوداء عند فتح التطبيق والتنقل: واجهة تحميل أصلية داكنة راقية تمنع أي فراغ أسود وتؤكد للمستخدم جاري التحميل فورياً.
          2. التحميل التدريجي الذكي (Sequential Pre-warming): تخصيص كامل سرعة الـ 4G للتبويب المعروض أولاً ثم باقي التبويبات تباعاً بدون بطء، مع حفظها في الذاكرة لتنقل فوري 0ms.
          3. إصلاح خطأ السيرفر 500 في صفحة تتبع الحلاق: توافق تام بين Neon PostgreSQL وتنسيق التاريخ والجلسات.
          4. حذف الشريط البرتقالي المتكرر نهائياً وتزامن الشريط السفلي الأصلي مع كل صفحة." || true
