name: Build BarberQueue APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Create BarberQueue Mobile App
        run: |
          set -e
          echo "=== 1. Creating Flutter App ==="
          flutter create barber_app --org com.barberqueue.dz --platforms android
          cd barber_app

          echo "=== 2. Upgrading Kotlin Version for Android Compatibility ==="
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.24"/' android/build.gradle || true
          fi

          echo "=== 3. Adding Dependencies ==="
          flutter pub add webview_flutter webview_flutter_android url_launcher

          echo "=== 4. Configuring Android Permissions & Intent Queries ==="
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.CAMERA"/>' "$MANIFEST"
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          
          # Add Package Visibility Queries for Android 11+ (WhatsApp, Maps, Tel)
          QUERIES='<queries>\n    <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="whatsapp" /></intent>\n    <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="tel" /></intent>\n    <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="geo" /></intent>\n    <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n</queries>'
          sed -i "/<manifest/a \$QUERIES" "$MANIFEST"

          echo "=== 5. Writing lib/main.dart with PopScope & Deep Linking ==="
          python3 -c "import base64; open('lib/main.dart', 'wb').write(base64.b64decode(''))"
          echo "lib/main.dart written successfully!"

          echo "=== 6. Building Release APK ==="
          flutter build apk --release

          echo "=== 7. Copying APK ==="
          cp build/app/outputs/flutter-apk/app-release.apk ../BarberQueue.apk
          echo "APK build complete: BarberQueue.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarberQueue-APK
          path: BarberQueue.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.1-${{ github.run_number }}" BarberQueue.apk \
            --title "BarberQueue Android App v1.0.1" \
            --notes "تطبيق دورك (BarberQueue DZ) الإصدار v1.0.1: دعم زر الرجوع PopScope، تكامل الواتساب والـ GPS الخارجي، إخفاء الشريط التلقائي مع لوحة المفاتيح، والإنعاش التلقائي بعد قفل الشاشة." || true
